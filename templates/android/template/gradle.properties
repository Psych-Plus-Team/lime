# Project-wide Gradle settings.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Optimized for modern JDK (25+) and large projects
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.configureondemand=true

# Enable Gradle build cache for faster incremental builds
org.gradle.caching=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Kotlin compilation optimizations
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m

# Android build optimizations
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Suppress SDK 36 warning (AGP 8.8 tested up to SDK 35)
android.suppressUnsupportedCompileSdk=36

# Suppress Java deprecation and unchecked warnings for dependencies
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Suppress lint warnings for deprecated APIs in dependencies
android.lint.disable=Deprecated

VERSION_NAME=::META_VERSION::
VERSION_CODE=::META_BUILD_NUMBER::

ANDROID_BUILD_TARGET_SDK_VERSION=::ANDROID_TARGET_SDK_VERSION::
ANDROID_BUILD_MIN_SDK_VERSION=::ANDROID_MINIMUM_SDK_VERSION::
ANDROID_BUILD_SDK_VERSION=::ANDROID_TARGET_SDK_VERSION::
ANDROID_BUILD_TOOLS_VERSION=::ANDROID_BUILD_TOOLS_VERSION::
::if (ANDROID_TARGET_SDK_VERSION>=28)::
android.useAndroidX=::ANDROID_USE_ANDROIDX::
android.enableJetifier=::ANDROID_ENABLE_JETIFIER::
::end::
